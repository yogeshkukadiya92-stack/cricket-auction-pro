<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Auction Pro is offline. Reconnect to continue the live cricket auction." />
  <title>Auction Pro | Offline</title>
  <style>
    :root { --bg: #04070D; --gold: #F59E0B; --gold-2: #FBBF24; --cyan: #06B6D4; --text: #E2E8F0; --muted: #94A3B8; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    body { display: grid; place-items: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
    .mesh { position: fixed; inset: -20%; background:
        radial-gradient(40% 35% at 30% 30%, rgba(245,158,11,.22), transparent 70%),
        radial-gradient(35% 30% at 75% 70%, rgba(6,182,212,.16), transparent 70%),
        radial-gradient(30% 30% at 60% 20%, rgba(139,92,246,.12), transparent 70%);
      filter: blur(40px); animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate3d(4%, -3%, 0) rotate(8deg) scale(1.08); } }
    main { position: relative; width: min(420px, 100%); perspective: 900px; }
    .card { padding: 40px 28px 32px; border-radius: 28px; text-align: center;
      background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.10); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08);
      transform-style: preserve-3d; transition: transform .6s cubic-bezier(.16,1,.3,1);
      animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px) rotateX(10deg); } }
    .logo { width: 96px; height: 96px; margin: 0 auto 24px; border-radius: 24px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(251,191,36,.35), 0 0 50px -6px rgba(245,158,11,.55); animation: float 3.2s ease-in-out infinite; transform: translateZ(40px); }
    .logo img { width: 100%; height: 100%; display: block; }
    @keyframes float { 50% { transform: translateZ(40px) translateY(-6px); } }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em;
      background: linear-gradient(90deg, var(--gold-2), var(--gold), #fff 120%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { margin-top: 10px; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #FCA5A5;
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.25); }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: #EF4444; box-shadow: 0 0 10px #EF4444; animation: pulse 1.2s infinite; }
    .status.online { color: #86EFAC; background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.3); }
    .status.online i { background: #10B981; box-shadow: 0 0 10px #10B981; }
    @keyframes pulse { 50% { opacity: .35; } }
    button { margin-top: 28px; width: 100%; padding: 16px; border: 0; border-radius: 16px; cursor: pointer;
      font-size: 16px; font-weight: 700; color: #111; background: linear-gradient(135deg, var(--gold-2), var(--gold));
      box-shadow: 0 12px 30px -8px rgba(245,158,11,.6), inset 0 1px 0 rgba(255,255,255,.5);
      transition: transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s; }
    button:active { transform: scale(.97); box-shadow: 0 6px 16px -6px rgba(245,158,11,.6); }
    button[disabled] { opacity: .7; }
  </style>
</head>
<body>
  <div class="mesh" aria-hidden="true"></div>
  <main>
    <section class="card" id="offline-card">
      <div class="logo"><img src="icon.png" alt="Auction Pro logo" /></div>
      <h1>You're offline</h1>
      <p>Auction Pro needs an internet connection to sync live bids, teams and purses with the auction server.</p>
      <span class="status" id="net-status"><i></i><span id="net-label">No connection</span></span>
      <button id="retry-btn" type="button">Retry connection</button>
    </section>
  </main>
  <script>
    var APP_URL = 'https://auctionpro.yogeshaihub.in/';
    var btn = document.getElementById('retry-btn');
    var badge = document.getElementById('net-status');
    var label = document.getElementById('net-label');
    function retry() { btn.disabled = true; btn.textContent = 'Connecting…'; window.location.replace(APP_URL); }
    function update() {
      var on = navigator.onLine;
      badge.classList.toggle('online', on);
      label.textContent = on ? 'Back online' : 'No connection';
      if (on) setTimeout(retry, 600);
    }
    btn.addEventListener('click', retry);
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    var card = document.getElementById('offline-card');
    window.addEventListener('deviceorientation', function (e) {
      if (e.beta == null) return;
      var rx = Math.max(-8, Math.min(8, (e.beta - 45) / 4));
      var ry = Math.max(-8, Math.min(8, e.gamma / 4));
      card.style.transform = 'rotateX(' + (-rx) + 'deg) rotateY(' + ry + 'deg)';
    });
  </script>
</body>
</html>
